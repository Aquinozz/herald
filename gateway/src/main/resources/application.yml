spring:
  application:
    name: gateway
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: endpoint-service
              uri: ${HERALD_ENDPOINT_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/**,/v3/api-docs/**,/swagger-ui/**,/webjars/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@appKeyKeyResolver}"

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus

herald:
  rate-limit:
    replenish-rate: 20
    burst-capacity: 40
    retry-after-seconds: 5